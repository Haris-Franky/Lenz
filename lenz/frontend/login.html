<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — Lenz</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="form-card">
    <h2>Connexion</h2>
    <div id="alertBox"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Nom d'utilisateur ou email</label>
        <input type="text" name="username" required />
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" name="password" required />
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Se connecter</button>
    </form>
    <p style="margin-top:16px; color: var(--text-muted);">
      Pas encore de compte ? <a href="register.html" style="color: var(--accent-2);">S'inscrire</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
