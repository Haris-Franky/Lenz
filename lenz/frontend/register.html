<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inscription — Lenz</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="form-card">
    <h2>Créer un compte</h2>
    <div id="alertBox"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" name="username" required minlength="3" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" name="password" required minlength="6" />
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">S'inscrire</button>
    </form>
    <p style="margin-top:16px; color: var(--text-muted);">
      Déjà un compte ? <a href="login.html" style="color: var(--accent-2);">Se connecter</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
